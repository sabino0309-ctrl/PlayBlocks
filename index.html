<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBlocks (Blocks++) Editor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold text-blue-400">PlayBlocks <span class="text-xs text-gray-400">Blocks++</span></h1>
            <nav class="flex space-x-2">
                <button class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm font-medium">File</button>
                <button class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm font-medium">Edit</button>
                <button class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm font-medium">Extensions</button>
            </nav>
        </div>
        <div>
            <button class="px-4 py-1.5 bg-green-600 hover:bg-green-500 rounded text-sm font-bold shadow">Run Project</button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Block Palette -->
        <aside class="w-64 bg-gray-800 border-r border-gray-700 p-4 flex flex-col space-y-4">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Blocks Palette</h2>
            <div class="space-y-2">
                <div class="p-2 bg-blue-600 rounded text-sm font-medium cursor-pointer shadow">Motion Blocks</div>
                <div class="p-2 bg-purple-600 rounded text-sm font-medium cursor-pointer shadow">Looks Blocks</div>
                <div class="p-2 bg-yellow-600 rounded text-sm font-medium cursor-pointer shadow">Control Blocks</div>
                <div class="p-2 bg-red-600 rounded text-sm font-medium cursor-pointer shadow">Java Classes</div>
            </div>
        </aside>

        <!-- Center: Visual Drag-and-Drop Canvas -->
        <main class="flex-1 bg-gray-950 relative flex items-center justify-center">
            <div class="text-center text-gray-600">
                <p class="text-lg font-medium">Drag blocks here to build your logic</p>
                <p class="text-xs mt-1">PlayBlocks Canvas Area</p>
            </div>
        </main>

        <!-- Right Side: Code Shower / C++ Transpiler Output -->
        <section class="w-80 bg-gray-900 border-l border-gray-700 p-4 flex flex-col">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">C++ Code Shower</h2>
            <div class="flex-1 bg-black rounded p-3 font-mono text-xs text-green-400 overflow-y-auto border border-gray-800">
                <code>// Transpiled C++ output will appear here in real-time<br><br>int main() {<br>&nbsp;&nbsp;&nbsp;&nbsp;// PlayBlocks initialized<br>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<br>}</code>
            </div>
        </section>

    </div>

</body>
</html>
