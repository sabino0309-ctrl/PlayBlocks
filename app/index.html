<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayBlocks (Blocks++) Editor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-900 border-b border-gray-700 px-6 py-3 flex justify-between items-center shadow-md z-50">
        <div class="flex items-center space-x-6">
            <h1 class="text-3xl font-black text-sky-400 tracking-tighter">
                PlayBlocks <span class="text-xs text-gray-500 align-super">Blocks++</span>
            </h1>
            <nav class="flex space-x-3">
                <button class="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-md text-sm font-medium transition">File</button>
                <button class="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-md text-sm font-medium transition">Edit</button>
                <button class="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-md text-sm font-medium transition">Extensions</button>
            </nav>
        </div>
        <div>
            <button class="px-5 py-2 bg-green-600 hover:bg-green-500 text-emerald-950 font-bold rounded-lg shadow-lg transition">
                Run Project
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Block Palette -->
        <aside class="w-72 bg-gray-900 border-r border-gray-700 p-6 flex flex-col space-y-6">
            <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Blocks Palette</h2>
            <div class="space-y-3">
                <div class="p-3 rounded-lg text-sm font-semibold cursor-pointer shadow-lg border-l-4 border-sky-500 bg-sky-950/80 text-sky-200 flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full border-2 border-sky-500"></div>
                    <span>Motion Blocks</span>
                </div>
                <div class="p-3 rounded-lg text-sm font-semibold cursor-pointer shadow-lg border-l-4 border-purple-500 bg-purple-950/80 text-purple-200 flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full border-2 border-purple-500"></div>
                    <span>Looks Blocks</span>
                </div>
                <div class="p-3 rounded-lg text-sm font-semibold cursor-pointer shadow-lg border-l-4 border-yellow-500 bg-yellow-950/80 text-yellow-200 flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full border-2 border-yellow-500"></div>
                    <span>Control Blocks</span>
                </div>
                <div class="p-3 rounded-lg text-sm font-semibold cursor-pointer shadow-lg border-l-4 border-red-500 bg-red-950/80 text-red-200 flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full border-2 border-red-500"></div>
                    <span>Java Classes</span>
                </div>
            </div>
        </aside>

        <!-- Center: Visual Drag-and-Drop Canvas -->
        <main class="flex-1 bg-gray-950 relative flex items-center justify-center border-r border-gray-800">
            <div class="text-center text-gray-700 p-10 border-2 border-dashed border-gray-800 rounded-3xl">
                <p class="text-2xl font-bold">Drag blocks here</p>
                <p class="text-sm mt-2">to build your logic</p>
            </div>
        </main>

        <!-- Right Side: Code Shower / C++ Transpiler Output -->
        <section class="w-96 bg-gray-900 border-l border-gray-700 p-6 flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-widest">C++ Code Shower</h2>
                <span class="text-[10px] text-green-600 font-bold px-2 py-0.5 rounded bg-green-950/50 border border-green-800/50 shadow-inner">LIVE</span>
            </div>
            <div class="flex-1 bg-black rounded-xl p-5 font-mono text-sm leading-relaxed overflow-y-auto border border-gray-800 shadow-inner">
                <code class="text-green-400">
                    // Transpiled C++ output<br><br>
                    int main() {<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;// PlayBlocks initialized<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;// Drag blocks to see logic...<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;return 0;<br>
                    }
                </code>
            </div>
        </section>

    </div>

</body>
</html>
